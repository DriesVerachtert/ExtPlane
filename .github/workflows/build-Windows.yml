name: Build on Windows

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_TRIPLET: x64-windows-static-md
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4

      - name: Check environment with bash
        shell: bash
        run: |
          set | grep QT

      - name: Check environment with shell
        run: set
        shell: cmd

      - name: Check environment with powershell
        run: |
          Get-ChildItem Env:
        shell: powershell

      - name: Get X-Plane SDK
        shell: bash
        run: |
          curl -L -o XPSDK.zip https://developer.x-plane.com/wp-content/plugins/code-sample-generation/sdk_zip_files/XPSDK411.zip
          unzip *.zip
          rm XPSDK*.zip
          mv SDK ~/

      - name: Setup environment variables for C/C++ compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-mosquitto

      - name: Install mosquitto devel package
        shell: pwsh
        run: |
          vcpkg install mosquitto:${{ env.VCPKG_TRIPLET }}

      - name: List contents of mosquitto dir
        shell: bash
        run: |
          echo "vcpkg installdir is ${VCPKG_INSTALLATION_ROOT}"
          ls -la ${VCPKG_INSTALLATION_ROOT}
          echo "checking includepath: "
          ls -l ${VCPKG_INSTALLATION_ROOT}/installed/${VCPKG_TRIPLET}/include
          echo "checking libs:"
          ls -l ${VCPKG_INSTALLATION_ROOT}/installed/${VCPKG_TRIPLET}/lib

      - name: Qmake
        shell: bash
        run: |
          VCPKG_WIN=$(cygpath -m "$VCPKG_INSTALLATION_ROOT")
          echo "VCPKG_WIN: ${VCPKG_WIN}"
          qmake -r CONFIG+=mqtt \
              "QMAKE_CXXFLAGS+=-DXPLM_DEPRECATED -DIBM" \
              "INCLUDEPATH+=${VCPKG_WIN}/installed/${VCPKG_TRIPLET}/include" \
              "LIBS+=-L${VCPKG_WIN}/installed/${VCPKG_TRIPLET}/lib"

      - name: Make
        shell: cmd
        run: nmake

      - name: Copy Qt DLLs next to the plugin
        shell: cmd
        run: |
          copy /y "%QT_ROOT_DIR%\bin\Qt6Core.dll" extplane-plugin\extplane\64\
          copy /y "%QT_ROOT_DIR%\bin\Qt6Network.dll" extplane-plugin\extplane\64\

      - name: Check plugin DLL dependencies
        shell: cmd
        run: dumpbin /dependents extplane-plugin\extplane\64\*.xpl extplane-plugin\extplane\64\*.dll

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: extplane-plugin-windows
          path: extplane-plugin/extplane/
          if-no-files-found: error

